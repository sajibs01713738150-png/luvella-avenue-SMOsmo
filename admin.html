<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Admin Dashboard - Luvella AVENUE</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; margin: 0; padding: 0; }
        body { background: #fff7f9; color: #2c1e24; padding: 15px; display: flex; justify-content: center; }
        .admin-box { width: 100%; max-width: 540px; background: #ffffff; border-radius: 18px; border: 1px solid #f0dce2; box-shadow: 0 10px 30px rgba(140, 39, 76, 0.12); overflow: hidden; }
        .admin-header { background: linear-gradient(135deg, #9e2d56, #6e1c3a); color: #ffffff; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
        .admin-header h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .back-shop { color: #ffffff; text-decoration: none; font-size: 13px; background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-weight: 600; }
        .admin-body { padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
        .stat-card { background: #fff5f8; border: 1px solid #f0dce2; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .stat-card span { font-size: 13px; color: #7a666e; font-weight: 600; }
        .stat-card strong { font-size: 18px; color: #8c274c; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #3d2830; }
        input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #e6c8d2; border-radius: 10px; margin-bottom: 12px; font-size: 14px; outline: none; background: #fffcfd; }
        input:focus, select:focus, textarea:focus { border-color: #8c274c; background: #ffffff; }
        .row-2 { display: flex; gap: 10px; }
        
        /* ইমেজ আপলোড বক্স ডিজাইন */
        .upload-area { border: 2px dashed #d99eb2; background: #fff8fa; border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; margin-bottom: 12px; transition: 0.2s; }
        .upload-area:hover { border-color: #8c274c; background: #fff0f4; }
        .upload-area p { font-size: 13.5px; color: #8c274c; font-weight: 600; }
        .upload-area small { font-size: 11.5px; color: #7a666e; }
        #imagePreviewBox { display: none; margin-bottom: 12px; text-align: center; position: relative; }
        #imagePreviewBox img { max-height: 150px; border-radius: 10px; border: 1px solid #f0dce2; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

        .submit-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #9e2d56, #7a1f40); color: #ffffff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(140, 39, 76, 0.25); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        hr { border: none; border-top: 1px solid #f0dce2; margin: 22px 0; }
        
        .prod-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #f0dce2; border-radius: 12px; margin-bottom: 10px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .prod-left { display: flex; align-items: center; gap: 12px; }
        .prod-left img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; border: 1px solid #f0dce2; }
        .del-btn { background: #e63946; color: #ffffff; border: none; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        #loginSection { padding: 45px 20px; text-align: center; }
    </style>
</head>
<body>

<div class="admin-box">
    <div class="admin-header">
        <h2>👑 Luvella কন্ট্রোল প্যানেল</h2>
        <a href="index.html" class="back-shop">ওয়েবসাইট দেখুন ↗</a>
    </div>

    <!-- পাসওয়ার্ড লগইন -->
    <div id="loginSection">
        <h3 style="margin-bottom: 8px; color: #8c274c;">অ্যাডমিন ভেরিফিকেশন</h3>
        <p style="font-size: 13px; color: #7a666e; margin-bottom: 15px;">পণ্য পরিচালনা করতে আপনার গোপন পিন দিন</p>
        <input type="password" id="adminPinInput" placeholder="পিন লিখুন (ডিফল্ট: 1234)" style="max-width: 260px; text-align: center; font-size: 16px;">
        <br>
        <button class="submit-btn" onclick="unlockAdmin()" style="max-width: 260px;">ড্যাশবোর্ডে প্রবেশ করুন</button>
    </div>

    <!-- মূল ড্যাশবোর্ড -->
    <div class="admin-body" id="dashboardSection" style="display: none;">
        <div class="stats-grid">
            <div class="stat-card">
                <span>মোট প্রোডাক্ট:</span>
                <strong id="totalProdBadge">0টি</strong>
            </div>
            <div class="stat-card">
                <span>ডাটাবেস স্ট্যাটাস:</span>
                <strong id="dbStatusBadge" style="font-size: 13px;">চেক হচ্ছে...</strong>
            </div>
        </div>

        <form id="productForm" onsubmit="saveProduct(event)">
            <label>১. প্রোডাক্টের ছবি আপলোড করুন *</label>
            <div class="upload-area" onclick="document.getElementById('pFile').click()">
                <p>📸 গ্যালারি বা কম্পিউটার থেকে ছবি বেছে নিন</p>
                <small>যেকোনো JPG, PNG বা WEBP ছবি সাপোর্ট করবে</small>
                <input type="file" id="pFile" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
            </div>
            <div id="imagePreviewBox">
                <img id="previewImg" src="" alt="Preview">
                <p style="font-size: 11px; color: #2a9d8f; font-weight: 600; margin-top: 4px;">✓ ছবিটি আপলোডের জন্য প্রস্তুত</p>
            </div>

            <label>২. প্রোডাক্টের নাম *</label>
            <input type="text" id="pName" placeholder="যেমন: প্রিমিয়াম লেদার হ্যান্ডব্যাগ" required>

            <div class="row-2">
                <div style="flex:1;">
                    <label>বর্তমান বিক্রয় মূল্য (৳) *</label>
                    <input type="number" id="pPrice" placeholder="1250" required>
                </div>
                <div style="flex:1;">
                    <label>পূর্বের মূল্য (অপশনাল)</label>
                    <input type="number" id="pOldPrice" placeholder="1600">
                </div>
            </div>

            <div class="row-2">
                <div style="flex:1;">
                    <label>ক্যাটাগরি নির্বাচন করুন *</label>
                    <select id="pCategory" required>
                        <option value="">বাছাই করুন</option>
                        <option value="ব্যাগ ও ফ্যাশন">ব্যাগ ও ফ্যাশন</option>
                        <option value="বিউটি কেয়ার">বিউটি কেয়ার</option>
                        <option value="স্মার্ট গ্যাজেট">স্মার্ট গ্যাজেট</option>
                        <option value="জুয়েলারি">জুয়েলারি</option>
                        <option value="হোম ডেকোর">হোম ডেকোর</option>
                        <option value="স্পেশাল অফার">স্পেশাল অফার</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label>স্টক অবস্থা</label>
                    <select id="pStock">
                        <option value="In Stock">In Stock (আছে)</option>
                        <option value="Stock Out">Stock Out (শেষ)</option>
                    </select>
                </div>
            </div>

            <label>সংক্ষিপ্ত বিবরণ / সাইজ / কালার (অপশনাল)</label>
            <textarea id="pDesc" rows="2" placeholder="যেমন: অরিজিনাল চামড়ার তৈরি, কালার: মেরুন ও কালো..."></textarea>

            <button type="submit" class="submit-btn" id="pubBtn">+ ওয়েবসাইটে প্রোডাক্ট পাবলিশ করুন</button>
        </form>

        <hr>
        <label>যুক্ত করা প্রোডাক্ট খুঁজুন ও পরিচালনা করুন:</label>
        <input type="text" id="adminSearchInput" onkeyup="filterAdminList()" placeholder="🔍 প্রোডাক্টের নাম লিখে খুঁজুন...">
        <div id="adminListContainer">লোড হচ্ছে...</div>
    </div>
</div>
<!-- Firebase SDK -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    // আপনার Firebase কনফিগারেশন কোড এখানে বসাবেন:
  const firebaseConfig = {
    apiKey: "AIzaSyCLUUQw6uLqGP-8RSRDUsGKTFi1wYnyM3A",
    authDomain: "://firebaseapp.com",
    projectId: "luvella-avenue-smo",
    storageBucket: "luvella-avenue-smo.firebasestorage.app",
    messagingSenderId: "781504317828",
    appId: "1:781504317828:web:12d81b3ba4b591fe89f5d1",
    measurementId: "G-17C1FDHR94"
};


    const ADMIN_PIN = "1234"; // আপনার গোপন পিন
    let db = null;
    let useLocalFallback = false;
    let selectedBase64Image = "";
    let allAdminProducts = [];




    function unlockAdmin() {
        const pin = document.getElementById('adminPinInput').value;
        if (pin === ADMIN_PIN) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('dbStatusBadge').innerText = useLocalFallback ? "লোকাল মোড" : "🟢 লাইভ ক্লাউড";
            loadAdminProducts();
        } else {
            alert("ভুল পিন দিয়েছেন! সঠিক পিন দিন।");
        }
    }

    // গ্যালারি থেকে সিলেক্ট করা ছবি স্বয়ংক্রিয়ভাবে অপ্টিমাইজ ও প্রিভিউ করার ফাংশন
    function handleImageSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxWidth = 600; // প্রিমিয়াম কোয়ালিটি ও দ্রুত লোডিংয়ের জন্য
                const scale = maxWidth / img.width;
                canvas.width = img.width > maxWidth ? maxWidth : img.width;
                canvas.height = img.width > maxWidth ? img.height * scale : img.height;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                selectedBase64Image = canvas.toDataURL('image/jpeg', 0.82);
                document.getElementById('previewImg').src = selectedBase64Image;
                document.getElementById('imagePreviewBox').style.display = 'block';
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function saveProduct(e) {
        e.preventDefault();
        if (!selectedBase64Image) {
            alert("দয়া করে গ্যালারি থেকে প্রোডাক্টের একটি ছবি বেছে নিন!");
            return;
        }

        const btn = document.getElementById('pubBtn');
        btn.innerText = "পাবলিশ হচ্ছে...";
        btn.disabled = true;

        const productData = {
            name: document.getElementById('pName').value.trim(),
            price: Number(document.getElementById('pPrice').value),
            oldPrice: document.getElementById('pOldPrice').value ? Number(document.getElementById('pOldPrice').value) : null,
            category: document.getElementById('pCategory').value,
            stock: document.getElementById('pStock').value,
            description: document.getElementById('pDesc').value.trim(),
            image: selectedBase64Image
        };

        if (!useLocalFallback) {
            try {
                await db.collection("products").add({
                    ...productData,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("অভিনন্দন! প্রোডাক্টটি লাইভ ওয়েবসাইটে যুক্ত হয়েছে।");
                resetAdminForm();
            } catch (err) {
                alert("এরর হয়েছে: " + err.message);
            }
        } else {
            let localProds = JSON.parse(localStorage.getItem('luvella_products')) || [];
            localProds.unshift({ id: Date.now(), ...productData });
            localStorage.setItem('luvella_products', JSON.stringify(localProds));
            alert("প্রোডাক্ট যুক্ত হয়েছে!");
            resetAdminForm();
            loadAdminProducts();
        }

        btn.innerText = "+ ওয়েবসাইটে প্রোডাক্ট পাবলিশ করুন";
        btn.disabled = false;
    }

    function resetAdminForm() {
        document.getElementById('productForm').reset();
        selectedBase64Image = "";
        document.getElementById('imagePreviewBox').style.display = 'none';
    }

    function loadAdminProducts() {
        if (!useLocalFallback) {
            db.collection("products").orderBy("createdAt", "desc").onSnapshot(snap => {
                allAdminProducts = [];
                snap.forEach(doc => allAdminProducts.push({ id: doc.id, ...doc.data() }));
                renderAdminList(allAdminProducts);
            });
        } else {
            allAdminProducts = JSON.parse(localStorage.getItem('luvella_products')) || [];
            renderAdminList(allAdminProducts);
        }
    }

    function filterAdminList() {
        const q = document.getElementById('adminSearchInput').value.toLowerCase();
        const filtered = allAdminProducts.filter(p => p.name.toLowerCase().includes(q));
        renderAdminList(filtered);
    }

    function renderAdminList(list) {
        const container = document.getElementById('adminListContainer');
        document.getElementById('totalProdBadge').innerText = `${allAdminProducts.length}টি`;

        if (list.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#7a666e; padding:15px;">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>`;
            return;
        }

        container.innerHTML = '';
        list.forEach(p => {
            container.innerHTML += `
                <div class="prod-item">
                    <div class="prod-left">
                        <img src="${p.image}">
                        <div>
                            <strong style="font-size:14px;">${p.name}</strong><br>
                            <small style="color:#8c274c; font-weight:600;">${p.price}৳ • ${p.category} • ${p.stock || 'In Stock'}</small>
                        </div>
                    </div>
                    <button class="del-btn" onclick="removeProduct('${p.id}')">মুছে ফেলুন</button>
                </div>
            `;
        });
    }

    async function removeProduct(id) {
        if (!confirm("আপনি কি নিশ্চিতভাবে এই প্রোডাক্টটি ওয়েবসাইট থেকে সরিয়ে ফেলতে চান?")) return;

        if (!useLocalFallback) {
            await db.collection("products").doc(id).delete();
            alert("প্রোডাক্টটি মুছে ফেলা হয়েছে!");
        } else {
            let localProds = JSON.parse(localStorage.getItem('luvella_products')) || [];
            localProds = localProds.filter(p => String(p.id) !== String(id));
            localStorage.setItem('luvella_products', JSON.stringify(localProds));
            loadAdminProducts();
        }
    }
</script>
</body>
</html>
