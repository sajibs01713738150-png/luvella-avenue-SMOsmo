<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Luvella AVENUE</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; margin: 0; padding: 0; }
        body { background: #fff7f9; color: #2c1e24; padding: 15px; display: flex; justify-content: center; }
        .admin-box { width: 100%; max-width: 540px; background: #ffffff; border-radius: 18px; border: 1px solid #f0dce2; box-shadow: 0 10px 30px rgba(140, 39, 76, 0.12); overflow: hidden; }
        .admin-header { background: linear-gradient(135deg, #9e2d56, #6e1c3a); color: #ffffff; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
        .admin-header h2 { font-size: 18px; }
        .back-shop { color: #ffffff; text-decoration: none; font-size: 13px; background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-weight: 600; }
        .admin-body { padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
        .stat-card { background: #fff5f8; border: 1px solid #f0dce2; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .stat-card span { font-size: 13px; color: #7a666e; font-weight: 600; }
        .stat-card strong { font-size: 17px; color: #8c274c; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #3d2830; }
        input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #e6c8d2; border-radius: 10px; margin-bottom: 12px; font-size: 14px; outline: none; background: #fffcfd; }
        input:focus, select:focus, textarea:focus { border-color: #8c274c; background: #ffffff; }
        .row-2 { display: flex; gap: 10px; }
        .upload-area { border: 2px dashed #d99eb2; background: #fff8fa; border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; margin-bottom: 12px; }
        .upload-area p { font-size: 14px; color: #8c274c; font-weight: 600; }
        #imagePreviewBox { display: none; margin-bottom: 12px; text-align: center; }
        #imagePreviewBox img { max-height: 150px; border-radius: 10px; border: 1px solid #f0dce2; }
        .submit-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #9e2d56, #7a1f40); color: #ffffff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        hr { border: none; border-top: 1px solid #f0dce2; margin: 22px 0; }
        .prod-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #f0dce2; border-radius: 12px; margin-bottom: 10px; background: #ffffff; }
        .prod-left { display: flex; align-items: center; gap: 12px; }
        .prod-left img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; border: 1px solid #f0dce2; }
        .del-btn { background: #e63946; color: #ffffff; border: none; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        #loginSection { padding: 45px 20px; text-align: center; }
    </style>
</head>
<body>

<div class="admin-box">
    <div class="admin-header">
        <h2>👑 Luvella কন্ট্রোল প্যানেল</h2>
        <a href="index.html" class="back-shop">ওয়েবসাইট দেখুন ↗</a>
    </div>

    <div id="loginSection">
        <h3 style="margin-bottom: 8px; color: #8c274c;">অ্যাডমিন ভেরিফিকেশন</h3>
        <input type="password" id="adminPinInput" placeholder="পিন দিন (1234)" style="max-width: 260px; text-align: center; font-size: 16px;">
        <br>
        <button type="button" class="submit-btn" id="loginBtn" style="max-width: 260px;">প্রবেশ করুন</button>
    </div>

    <div class="admin-body" id="dashboardSection" style="display: none;">
        <div class="stats-grid">
            <div class="stat-card">
                <span>মোট প্রোডাক্ট:</span>
                <strong id="totalProdBadge">0টি</strong>
            </div>
            <div class="stat-card">
                <span>সার্ভার:</span>
                <strong id="serverStatusText" style="font-size: 13px; color: #2a9d8f;">চেক হচ্ছে...</strong>
            </div>
        </div>

        <form id="productForm">
            <label>১. প্রোডাক্টের ছবি আপলোড করুন *</label>
            <div class="upload-area" id="uploadTrigger">
                <p>📸 গ্যালারি থেকে ছবি সিলেক্ট করুন</p>
                <input type="file" id="pFile" accept="image/*" style="display: none;">
            </div>
            <div id="imagePreviewBox">
                <img id="previewImg" src="" alt="Preview">
                <p style="font-size: 11px; color: #2a9d8f; font-weight: 600; margin-top: 4px;">✓ ছবি প্রস্তুত</p>
            </div>

            <label>২. প্রোডাক্টের নাম *</label>
            <input type="text" id="pName" placeholder="প্রোডাক্টের নাম লিখুন" required>

            <div class="row-2">
                <div style="flex:1;">
                    <label>বর্তমান দাম (৳) *</label>
                    <input type="number" id="pPrice" placeholder="549" required>
                </div>
                <div style="flex:1;">
                    <label>পূর্বের দাম (অপশনাল)</label>
                    <input type="number" id="pOldPrice" placeholder="850">
                </div>
            </div>

            <div class="row-2">
                <div style="flex:1;">
                    <label>ক্যাটাগরি *</label>
                    <select id="pCategory" required>
                        <option value="">বাছাই করুন</option>
                        <option value="ব্যাগ ও ফ্যাশন">ব্যাগ ও ফ্যাশন</option>
                        <option value="বিউটি কেয়ার">বিউটি কেয়ার</option>
                        <option value="স্মার্ট গ্যাজেট">স্মার্ট গ্যাজেট</option>
                        <option value="জুয়েলারি">জুয়েলারি</option>
                        <option value="হোম ডেকোর">হোম ডেকোর</option>
                        <option value="স্পেশাল অফার">স্পেশাল অফার</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label>স্টক অবস্থা</label>
                    <select id="pStock">
                        <option value="In Stock">In Stock</option>
                        <option value="Stock Out">Stock Out</option>
                    </select>
                </div>
            </div>

            <label>বিবরণ / ফেব্রিক্স / সাইজ</label>
            <textarea id="pDesc" rows="2" placeholder="যেমন: Cotton Fleece With One Side Brush"></textarea>

            <button type="submit" class="submit-btn" id="pubBtn">+ ওয়েবসাইটে প্রোডাক্ট পাবলিশ করুন</button>
        </form>

        <hr>
        <input type="text" id="adminSearchInput" placeholder="🔍 প্রোডাক্ট খুঁজুন...">
        <div id="adminListContainer">লোড হচ্ছে...</div>
    </div>
</div>

<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    const ADMIN_PIN = "1234";
    let db = null;
    let selectedImageData = "";
    let allProducts = [];

    const firebaseConfig = {
        apiKey: "AIzaSyCLUUQw6uLqGP-8RSRDUsGKTFi1wYnyM3A",
        authDomain: "://firebaseapp.com",
        projectId: "luvella-avenue-smo",
        storageBucket: "luvella-avenue-smo.firebasestorage.app",
        messagingSenderId: "781504317828",
        appId: "1:781504317828:web:12d81b3ba4b591fe89f5d1",
        measurementId: "G-17C1FDHR94"
    };

    try {
        if (typeof firebase !== 'undefined') {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        }
    } catch (e) {
        console.error("Firebase init error:", e);
    }

    // লগইন বাটন ইভেন্ট
    document.getElementById('loginBtn').addEventListener('click', function() {
        const pin = document.getElementById('adminPinInput').value.trim();
        if (pin === ADMIN_PIN) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('serverStatusText').innerText = db ? "🟢 লাইভ ক্লাউড" : "🟡 অফলাইন মোড";
            listenProducts();
        } else {
            alert("ভুল পিন দিয়েছেন! সঠিক পিন দিন।");
        }
    });

    // এন্টার চাপলেও লগইন হবে
    document.getElementById('adminPinInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    // ইমেজ সিলেক্ট ও কম্প্রেশন
    document.getElementById('uploadTrigger').addEventListener('click', function() {
        document.getElementById('pFile').click();
    });

    document.getElementById('pFile').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxW = 450;
                const scale = maxW / img.width;
                canvas.width = img.width > maxW ? maxW : img.width;
                canvas.height = img.width > maxW ? img.height * scale : img.height;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                selectedImageData = canvas.toDataURL('image/jpeg', 0.75);
                document.getElementById('previewImg').src = selectedImageData;
                document.getElementById('imagePreviewBox').style.display = 'block';
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });

    // প্রোডাক্ট সেভ ফাংশন
    document.getElementById('productForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        if (!selectedImageData) {
            alert("দয়া করে একটি ছবি সিলেক্ট করুন!");
            return;
        }

        const btn = document.getElementById('pubBtn');
        btn.innerText = "পাবলিশ হচ্ছে...";
        btn.disabled = true;

        const newProd = {
            name: document.getElementById('pName').value.trim(),
            price: Number(document.getElementById('pPrice').value),
            oldPrice: document.getElementById('pOldPrice').value ? Number(document.getElementById('pOldPrice').value) : null,
            category: document.getElementById('pCategory').value,
            stock: document.getElementById('pStock').value,
            description: document.getElementById('pDesc').value.trim(),
            image: selectedImageData
        };

        try {
            if (db) {
                await db.collection("products").add({
                    ...newProd,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } else {
                let local = JSON.parse(localStorage.getItem('luvella_products')) || [];
                local.unshift({ id: Date.now(), ...newProd });
                localStorage.setItem('luvella_products', JSON.stringify(local));
                listenProducts();
            }

            document.getElementById('productForm').reset();
            selectedImageData = "";
            document.getElementById('imagePreviewBox').style.display = 'none';
            alert("সফলভাবে ওয়েবসাইটে যুক্ত হয়েছে!");
        } catch (err) {
            alert("সমস্যা হয়েছে: " + err.message);
        }

        btn.innerText = "+ ওয়েবসাইটে প্রোডাক্ট পাবলিশ করুন";
        btn.disabled = false;
    });

    function listenProducts() {
        if (db) {
            db.collection("products").orderBy("createdAt", "desc").onSnapshot(snap => {
                allProducts = [];
                snap.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
                renderList(allProducts);
            }, err => {
                document.getElementById('adminListContainer').innerHTML = `<p style="color:red;">ডাটাবেস এরর: ${err.message}</p>`;
            });
        } else {
            allProducts = JSON.parse(localStorage.getItem('luvella_products')) || [];
            renderList(allProducts);
        }
    }

    document.getElementById('adminSearchInput').addEventListener('keyup', function() {
        const q = this.value.toLowerCase();
        renderList(allProducts.filter(p => p.name.toLowerCase().includes(q)));
    });

    function renderList(list) {
        const box = document.getElementById('adminListContainer');
        document.getElementById('totalProdBadge').innerText = `${allProducts.length}টি`;

        if (list.length === 0) {
            box.innerHTML = `<p style="text-align:center; color:#7a666e; padding:15px;">কোনো প্রোডাক্ট নেই।</p>`;
            return;
        }

        box.innerHTML = '';
        list.forEach(p => {
            box.innerHTML += `
                <div class="prod-item">
                    <div class="prod-left">
                        <img src="${p.image}">
                        <div>
                            <strong style="font-size:14px;">${p.name}</strong><br>
                            <small style="color:#8c274c; font-weight:600;">${p.price}৳ • ${p.category}</small>
                        </div>
                    </div>
                    <button class="del-btn" onclick="removeProduct('${p.id}')">মুছে ফেলুন</button>
                </div>
            `;
        });
    }

    async function removeProduct(id) {
        if (!confirm("নিশ্চিতভাবে মুছে ফেলতে চান?")) return;
        if (db) {
            await db.collection("products").doc(id).delete();
        } else {
            let local = JSON.parse(localStorage.getItem('luvella_products')) || [];
            local = local.filter(p => String(p.id) !== String(id));
            localStorage.setItem('luvella_products', JSON.stringify(local));
            listenProducts();
        }
    }
</script>
</body>
</html>
